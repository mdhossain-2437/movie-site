name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      APP_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint web application
        run: pnpm lint

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run unit, contract & negative policy tests
        run: pnpm test

      - name: Initialize local PostgreSQL schema & baseline genres
        run: pnpm db:migrate && pnpm db:seed

      - name: Build Next.js 16 production bundle
        env:
          NODE_ENV: production
          APP_ENV: test
        run: pnpm build

      - name: Install Playwright headless shell
        run: pnpm exec playwright install chromium --only-shell

      - name: Run Playwright E2E & 8-breakpoint responsive suite
        run: pnpm test:e2e
